name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v4

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check native formatting
        run: |
          python3 -m pip install --disable-pip-version-check clang-format==22.1.8
          clang-format --dry-run --Werror native/src/il2cpp_native.c native/include/il2cpp_native.h

  native:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build with strict diagnostics
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S native -B build/strict-${{ matrix.cc }} \
            -DTURBOHEADER_BUILD_JNI=ON \
            -DTURBOHEADER_STRICT_WARNINGS=ON \
            -DTURBOHEADER_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/strict-${{ matrix.cc }} --parallel 2

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run synthetic fixture suite
        run: ./tests/run_all.sh

  memcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      - name: Check native reads, writes, and leaks
        run: |
          cmake -S native -B build/valgrind \
            -DTURBOHEADER_BUILD_JNI=OFF \
            -DTURBOHEADER_STRICT_WARNINGS=ON \
            -DTURBOHEADER_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/valgrind --parallel 2
          TURBOHEADER_VALGRIND_BUILD_DIR="$PWD/build/valgrind" python3 tests/test_valgrind.py
