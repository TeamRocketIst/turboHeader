name: Weekly Ghidra compatibility release

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ghidra_tag:
        description: "Ghidra release tag; leave empty to use the latest official release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-ghidra-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.release.outputs.build }}
      extension_version: ${{ steps.release.outputs.extension_version }}
      ghidra_matrix: ${{ steps.release.outputs.ghidra_matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Find the Ghidra release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.ghidra_tag }}
        shell: bash
        run: |
          set -euo pipefail
          extension_version="$(sed -n 's/^version=//p' extension.properties)"
          [[ -n "$extension_version" ]] || {
            echo "extension.properties has no version" >&2
            exit 1
          }
          release_tag="v${extension_version}"
          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            requested_tag="$REQUESTED_TAG"
            [[ "$requested_tag" =~ ^Ghidra_[0-9]+\.[0-9]+(\.[0-9]+)?_build$ ]] || {
              echo "Invalid Ghidra release tag: $requested_tag" >&2
              exit 1
            }
            release_json="$(gh api "repos/NationalSecurityAgency/ghidra/releases/tags/$requested_tag")"
          else
            release_json="$(gh api repos/NationalSecurityAgency/ghidra/releases/latest)"
            requested_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          fi
          [[ "$requested_tag" =~ ^Ghidra_[0-9]+\.[0-9]+(\.[0-9]+)?_build$ ]] || {
            echo "Invalid Ghidra release tag returned by GitHub: $requested_tag" >&2
            exit 1
          }

          ghidra_asset_json="$(jq -c '
            [.assets[]? | select(
              (.name | endswith(".zip")) and
              (.name | contains("_PUBLIC_"))
            )][0] // empty
          ' <<<"$release_json")"
          ghidra_url="$(jq -r '.browser_download_url // empty' <<<"$ghidra_asset_json")"
          ghidra_digest="$(jq -r '.digest // empty' <<<"$ghidra_asset_json")"
          [[ -n "$ghidra_url" ]] || {
            echo "No public Ghidra distribution ZIP found for $requested_tag" >&2
            exit 1
          }
          ghidra_asset="${ghidra_url##*/}"
          ghidra_version="$(sed -E 's/^ghidra_([^_]+)_PUBLIC_.*/\1/' <<<"$ghidra_asset")"
          [[ "$ghidra_version" != "$ghidra_asset" ]] || {
            echo "Cannot determine Ghidra version from $ghidra_asset" >&2
            exit 1
          }
          ghidra_matrix="$(jq -cn \
            --arg tag "$requested_tag" \
            --arg version "$ghidra_version" \
            --arg url "$ghidra_url" \
            --arg digest "$ghidra_digest" \
            '[{tag:$tag,version:$version,url:$url,digest:$digest}]')"

          build=true
          if published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$release_tag" 2>/dev/null)"; then
            existing="$(jq -r '.assets[]?.name // empty' <<<"$published")"
            build=false
            platforms=(win_x86_64 mac_x86_64 mac_aarch64 linux_x86_64 linux_aarch64)
            for platform in "${platforms[@]}"; do
              asset="turboheader-${extension_version}-ghidra-${ghidra_version}-${platform}.zip"
              if ! grep -Fxq "$asset" <<<"$existing"; then
                build=true
              fi
            done
            if ! grep -Fxq SHA256SUMS <<<"$existing"; then
              build=true
            fi
          fi
          if [[ "$build" == false ]]; then
            echo "Release $release_tag already contains every $ghidra_version build."
          fi

          {
            echo "build=$build"
            echo "extension_version=$extension_version"
            echo "ghidra_matrix=$ghidra_matrix"
            echo "release_tag=$release_tag"
          } >>"$GITHUB_OUTPUT"

  release-tests:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run complete release test suite
        run: CC=gcc ./tests/run_all.sh

  release-clang-sanitizers:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
      - name: Run Clang ASan and UBSan tests
        run: |
          cmake -S native -B native/build-release-clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTURBOHEADER_BUILD_JNI=OFF \
            -DTURBOHEADER_STRICT_WARNINGS=ON \
            -DTURBOHEADER_WARNINGS_AS_ERRORS=ON \
            -DTURBOHEADER_ENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER=clang
          cmake --build native/build-release-clang --parallel 2
          TURBOHEADER_SANITIZER_BUILD_DIR="$PWD/native/build-release-clang" \
            python3 tests/test_sanitizers.py

  release-valgrind:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Run Valgrind tests
        run: |
          cmake -S native -B native/build-release-valgrind \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTURBOHEADER_BUILD_JNI=OFF \
            -DTURBOHEADER_STRICT_WARNINGS=ON \
            -DTURBOHEADER_WARNINGS_AS_ERRORS=ON
          cmake --build native/build-release-valgrind --parallel 2
          TURBOHEADER_VALGRIND_BUILD_DIR="$PWD/native/build-release-valgrind" \
            python3 tests/test_valgrind.py

  build-desktop:
    needs: [discover, release-tests, release-clang-sanitizers, release-valgrind]
    if: needs.discover.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(needs.discover.outputs.ghidra_matrix) }}
        target:
          - platform: win_x86_64
            os: windows-2022
            library: turboheader_il2cpp.dll
            cli: il2cpp_native_cli.exe
          - platform: mac_x86_64
            os: macos-15-intel
            library: libturboheader_il2cpp.dylib
            cli: il2cpp_native_cli
          - platform: mac_aarch64
            os: macos-15
            library: libturboheader_il2cpp.dylib
            cli: il2cpp_native_cli
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Ghidra
        env:
          GHIDRA_URL: ${{ matrix.ghidra.url }}
          GHIDRA_DIGEST: ${{ matrix.ghidra.digest }}
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/turboheader-ghidra"
          rm -rf "$download_dir"
          mkdir -p "$download_dir/ghidra-dist"
          curl --fail --location --retry 3 --output "$download_dir/ghidra.zip" "$GHIDRA_URL"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          digest = os.environ.get("GHIDRA_DIGEST", "")
          if digest:
              algorithm, expected = digest.split(":", 1)
              if algorithm != "sha256":
                  raise SystemExit(f"unsupported Ghidra asset digest: {digest}")
              actual = hashlib.sha256(Path(os.environ["RUNNER_TEMP"]).joinpath(
                  "turboheader-ghidra", "ghidra.zip").read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit("Ghidra distribution checksum mismatch")
          PY
          python3 -m zipfile -e "$download_dir/ghidra.zip" "$download_dir/ghidra-dist"
          ghidra_dir="$(find "$download_dir/ghidra-dist" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          [[ "$(find "$download_dir/ghidra-dist" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]]
          [[ -f "$ghidra_dir/support/buildExtension.gradle" ]]
          chmod +x "$ghidra_dir/support/analyzeHeadless" "$ghidra_dir/support/launch.sh"
          echo "GHIDRA_INSTALL_DIR=$(cd "$ghidra_dir" && pwd)" >>"$GITHUB_ENV"
      - name: Build and verify native target
        env:
          PLATFORM: ${{ matrix.target.platform }}
          LIBRARY: ${{ matrix.target.library }}
          CLI: ${{ matrix.target.cli }}
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/native \
            -DTURBOHEADER_BUILD_JNI=ON \
            -DTURBOHEADER_STRICT_WARNINGS=ON \
            -DTURBOHEADER_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2

          library_path="$(find build/native -type f -name "$LIBRARY" -print -quit)"
          cli_path="$(find build/native -type f -name "$CLI" -print -quit)"
          [[ "$(find build/native -type f -name "$LIBRARY" | wc -l)" -eq 1 ]]
          [[ "$(find build/native -type f -name "$CLI" | wc -l)" -eq 1 ]]
          [[ -n "$library_path" && -n "$cli_path" ]]
          mkdir -p "native-verified/$PLATFORM" "extension-os/$PLATFORM"
          cp "$library_path" "$cli_path" "native-verified/$PLATFORM/"
          cp "$library_path" "extension-os/$PLATFORM/"

          arch=x86_64
          [[ "$PLATFORM" == mac_aarch64 ]] && arch=aarch64
          python3 tools/verify_native.py \
            --library "native-verified/$PLATFORM/$LIBRARY" \
            --cli "native-verified/$PLATFORM/$CLI" \
            --arch "$arch" \
            --platform "$PLATFORM" \
            --provenance "native-verified/$PLATFORM/provenance.json" \
            --smoke-header tests/fixtures/sample.h \
            --smoke-offsets tests/fixtures/type_offsets.json
      - name: Package extension
        env:
          PLATFORM: ${{ matrix.target.platform }}
          EXTENSION_VERSION: ${{ needs.discover.outputs.extension_version }}
          GHIDRA_VERSION: ${{ matrix.ghidra.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          TURBOHEADER_PREBUILT_OS="$PWD/extension-os" \
            ./gradlew --no-daemon clean buildExtension
          extension_archives=(dist/*.zip)
          [[ "${#extension_archives[@]}" -eq 1 && -f "${extension_archives[0]}" ]]
          extension_zip="${extension_archives[0]}"
          output="turboheader-${EXTENSION_VERSION}-ghidra-${GHIDRA_VERSION}-${PLATFORM}.zip"
          cp "$extension_zip" "$output"
          python3 tools/verify_extension.py "$output"
          TURBOHEADER_EXTENSION_ZIP="$PWD/$output" \
            TURBOHEADER_TEST_TEMP="$PWD/build/release-test" \
            ./tests/test_real_ghidra.sh
          echo "ASSET=$output" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v6
        with:
          name: extension-${{ matrix.ghidra.version }}-${{ matrix.target.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: [discover, release-tests, release-clang-sanitizers, release-valgrind]
    if: needs.discover.outputs.build == 'true'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(needs.discover.outputs.ghidra_matrix) }}
        target:
          - platform: linux_x86_64
            os: ubuntu-24.04
            arch: x86_64
          - platform: linux_aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.target.os }}
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake curl findutils git ninja-build python3 unzip
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Ghidra
        env:
          GHIDRA_URL: ${{ matrix.ghidra.url }}
          GHIDRA_DIGEST: ${{ matrix.ghidra.digest }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/turboheader-ghidra"
          rm -rf "$download_dir"
          mkdir -p "$download_dir/ghidra-dist"
          curl --fail --location --retry 3 --output "$download_dir/ghidra.zip" "$GHIDRA_URL"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          digest = os.environ.get("GHIDRA_DIGEST", "")
          if digest:
              algorithm, expected = digest.split(":", 1)
              if algorithm != "sha256":
                  raise SystemExit(f"unsupported Ghidra asset digest: {digest}")
              actual = hashlib.sha256(Path(os.environ["RUNNER_TEMP"]).joinpath(
                  "turboheader-ghidra", "ghidra.zip").read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit("Ghidra distribution checksum mismatch")
          PY
          python3 -m zipfile -e "$download_dir/ghidra.zip" "$download_dir/ghidra-dist"
          ghidra_dir="$(find "$download_dir/ghidra-dist" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          [[ "$(find "$download_dir/ghidra-dist" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]]
          [[ -f "$ghidra_dir/support/buildExtension.gradle" ]]
          chmod +x "$ghidra_dir/support/analyzeHeadless" "$ghidra_dir/support/launch.sh"
          echo "GHIDRA_INSTALL_DIR=$(cd "$ghidra_dir" && pwd)" >>"$GITHUB_ENV"
      - name: Build and verify native target
        env:
          PLATFORM: ${{ matrix.target.platform }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          cmake -S native -B build/native -G Ninja \
            -DTURBOHEADER_BUILD_JNI=ON \
            -DTURBOHEADER_STRICT_WARNINGS=ON \
            -DTURBOHEADER_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2

          mkdir -p "native-verified/$PLATFORM" "extension-os/$PLATFORM"
          cp build/native/libturboheader_il2cpp.so build/native/il2cpp_native_cli \
            "native-verified/$PLATFORM/"
          cp build/native/libturboheader_il2cpp.so "extension-os/$PLATFORM/"
          python3 tools/verify_native.py \
            --library "native-verified/$PLATFORM/libturboheader_il2cpp.so" \
            --cli "native-verified/$PLATFORM/il2cpp_native_cli" \
            --arch "$ARCH" \
            --platform "$PLATFORM" \
            --glibc-max 2.35 \
            --provenance "native-verified/$PLATFORM/provenance.json" \
            --smoke-header tests/fixtures/sample.h \
            --smoke-offsets tests/fixtures/type_offsets.json
      - name: Package extension
        env:
          PLATFORM: ${{ matrix.target.platform }}
          EXTENSION_VERSION: ${{ needs.discover.outputs.extension_version }}
          GHIDRA_VERSION: ${{ matrix.ghidra.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          TURBOHEADER_PREBUILT_OS="$PWD/extension-os" \
            ./gradlew --no-daemon clean buildExtension
          extension_archives=(dist/*.zip)
          [[ "${#extension_archives[@]}" -eq 1 && -f "${extension_archives[0]}" ]]
          extension_zip="${extension_archives[0]}"
          output="turboheader-${EXTENSION_VERSION}-ghidra-${GHIDRA_VERSION}-${PLATFORM}.zip"
          cp "$extension_zip" "$output"
          python3 tools/verify_extension.py "$output"
          TURBOHEADER_EXTENSION_ZIP="$PWD/$output" \
            TURBOHEADER_TEST_TEMP="$PWD/build/release-test" \
            ./tests/test_real_ghidra.sh
          echo "ASSET=$output" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v6
        with:
          name: extension-${{ matrix.ghidra.version }}-${{ matrix.target.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [discover, release-tests, release-clang-sanitizers, release-valgrind, build-desktop, build-linux]
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: extension-*
          path: release-assets
          merge-multiple: true
      - name: Preserve existing compatibility archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p existing-assets
            while IFS= read -r asset; do
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir existing-assets
            done < <(gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[]?.name | select(endswith(".zip"))')
            find existing-assets -maxdepth 1 -type f -name '*.zip' \
              -exec cp --no-clobber {} release-assets/ \;
          fi
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS
      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
          EXTENSION_VERSION: ${{ needs.discover.outputs.extension_version }}
        run: |
          set -euo pipefail
          manual_notes=".github/release-notes/v${EXTENSION_VERSION}.md"
          [[ -f "$manual_notes" ]] || {
            echo "Missing release notes: $manual_notes" >&2
            exit 1
          }
          notes="$(mktemp)"
          versions="$(mktemp)"
          for archive in release-assets/*.zip; do
            name="${archive##*/}"
            version_platform="${name#turboheader-${EXTENSION_VERSION}-ghidra-}"
            printf '%s\n' "${version_platform%%-*}" >>"$versions"
          done
          cat >"$notes" <<EOF
          This release includes verified builds for these Ghidra versions:

          | Ghidra | Windows x86-64 | macOS x86-64 | macOS ARM64 | Linux x86-64 | Linux ARM64 |
          | --- | --- | --- | --- | --- | --- |
          EOF
          while IFS= read -r ghidra_version; do
            printf '| %s | yes | yes | yes | yes | yes |\n' "$ghidra_version" >>"$notes"
          done < <(sort -Vu "$versions")
          cat >>"$notes" <<EOF

          Choose the archive containing your exact Ghidra version and platform.
          Verify downloads with the attached \`SHA256SUMS\` file.

          EOF
          cat "$manual_notes" >>"$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              release-assets/*.zip release-assets/SHA256SUMS
            gh release edit "$RELEASE_TAG" \
              --title "TurboHeader $EXTENSION_VERSION" \
              --notes-file "$notes" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "TurboHeader $EXTENSION_VERSION" \
              --generate-notes \
              --notes-file "$notes" \
              --latest \
              release-assets/*.zip release-assets/SHA256SUMS
          fi
